# Local MSSQL for the assessment.
#   docker compose up -d
# Starts SQL Server 2022 on localhost:1433 and creates the TESTDB database.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maybank-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Maybank@12345}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maybank-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Maybank@12345}"
    entrypoint: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -b
      -Q \"IF DB_ID('TESTDB') IS NULL CREATE DATABASE TESTDB; SELECT name FROM sys.databases WHERE name = 'TESTDB';\""
    restart: "no"

volumes:
  mssql-data:
